[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "acadian-real-alpha-research"
version = "1.0.0"
description = "Independent empirical research framework inspired by publicly disclosed systematic equity investing principles"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "pyarrow>=12", "pytest>=7", "statsmodels>=0.14", "thrift>=0.16"]
[tool.setuptools.packages.find]
where = ["src"]
