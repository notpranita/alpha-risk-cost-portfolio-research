[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acadian-alpha-risk-cost"
version = "1.0.0"
description = "Independent, auditable equity alpha-risk-cost research inspired by Acadian's public disclosures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Independent Quantitative Research" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4"]

[project.scripts]
acadian-arc = "acadian_arc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["acadian_arc"]

[tool.coverage.report]
show_missing = true
