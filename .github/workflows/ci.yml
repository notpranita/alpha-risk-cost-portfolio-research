name: Python unit and integration tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install research package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests and coverage
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: 'Agg'
        run: python -m pytest --cov=acadian_arc --cov-report=term-missing
      - name: Validate end-to-end command
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: 'Agg'
        run: acadian-arc --months 22 --output-dir reports/ci-synthetic
      - name: Verify report artifact exists
        run: test -f reports/ci-synthetic/summary.json
